name: Encrypted gallery Android performance harness

on:
  workflow_dispatch:
  push:
    branches: [agent/secret-camera-gallery-performance]

permissions:
  contents: read

concurrency:
  group: gallery-perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install lockfile dependencies
        run: npm ci
      - name: Generate isolated debuggable test APK with embedded harness
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            node scripts/prepare-gallery-perf-gradle.js --cleanup || true
            node scripts/prepare-gallery-perf.js --cleanup || true
          }
          trap cleanup EXIT
          node scripts/prepare-gallery-perf.js
          npm run test:ci -- --runTestsByPath __tests__/encrypted-photo-view.test.tsx app/components/GalleryView.test.tsx
          npm run typecheck
          npx expo prebuild --platform android --no-install
          node scripts/prepare-gallery-perf-gradle.js
          ./android/gradlew --no-daemon -p android :app:assembleRelease
          python3 scripts/verify-gallery-perf-apk.py android/app/build/outputs/apk/release/app-release.apk bench/synthetic-gallery.jpg
      - name: Enable KVM on hosted runner
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure synthetic gallery on API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          script: bash scripts/run-gallery-perf.sh
      - name: Upload synthetic measurement reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-perf-results
          path: gallery-perf-results/
          if-no-files-found: warn
