name: Deploy Documentation to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Create clean _site directory
        run: mkdir _site

      - name: Convert Markdown to HTML
        run: |
          # Convert README.md to index.html with a title
          echo "<html><head><title>Secret Camera App</title></head><body>" > _site/index.html
          pandoc README.md >> _site/index.html
          echo "</body></html>" >> _site/index.html

          # Convert PRIVACY.md to PRIVACY.html with a title
          echo "<html><head><title>Privacy Policy - Secret Camera App</title></head><body>" > _site/PRIVACY.html
          pandoc PRIVACY.md >> _site/PRIVACY.html
          echo "</body></html>" >> _site/PRIVACY.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
