name: Deploy Documentation and F-Droid to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  workflow_run:
    workflows: ['Android stable release']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      ANDROID_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned F-Droid tooling
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-fdroid.txt 'qrcode[pil]==8.2'
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Collect and verify published APK releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/collect-fdroid-releases.js --output "$RUNNER_TEMP/fdroid-input"
      - name: Build signed F-Droid repository
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
          FDROID_STORE_PASSWORD: ${{ secrets.FDROID_STORE_PASSWORD }}
          FDROID_REPO_FINGERPRINT: ${{ vars.FDROID_REPO_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/fdroid-repository.jks"
          cleanup() { rm -f "$key"; }
          trap cleanup EXIT
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          export FDROID_KEYSTORE="$key"
          export FDROID_KEYALIAS="$FDROID_KEY_ALIAS"
          export FDROID_STOREPASS="$FDROID_STORE_PASSWORD"
          export FDROID_KEYPASS="$FDROID_KEY_PASSWORD"
          export FDROID_EXPECTED_FINGERPRINT="$FDROID_REPO_FINGERPRINT"
          mkdir -p _site/fdroid
          .venv/bin/python scripts/build-fdroid-repo.py \
            --apks "$RUNNER_TEMP/fdroid-input/apks" \
            --output _site/fdroid/repo \
            --manifest "$RUNNER_TEMP/fdroid-input/manifest.json"
      - name: Render documentation and enrollment QR
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          mkdir -p _site
          pandoc README.md --standalone --metadata title='Secret Camera' -o _site/index.html
          pandoc PRIVACY.md --standalone --metadata title='Privacy Policy - Secret Camera' -o _site/PRIVACY.html
          pandoc docs/fdroid.md --standalone --metadata title='Secret Camera F-Droid repository' -o _site/FDROID.html
          .venv/bin/python scripts/create-fdroid-enrollment.py \
            --output _site/fdroid-enrollment.png
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
